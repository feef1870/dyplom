services:
  postgres:
    image: postgres:16
    container_name: dyplom-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345678
      POSTGRES_DB: dyplom
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./keycloak/init-keycloak-db.sql:/docker-entrypoint-initdb.d/01-keycloak.sql:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dyplom"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: dyplom-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      # Pin the public URL so the token `iss` claim is always
      # http://localhost:8081/realms/dyplom regardless of which hostname
      # clients use to reach Keycloak.
      KC_HOSTNAME_URL: http://localhost:8081
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro,Z
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./backend
    container_name: dyplom-backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/dyplom
      DB_USERNAME: postgres
      DB_PASSWORD: 12345678
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/dyplom/protocol/openid-connect/certs
      KEYCLOAK_ISSUER: http://localhost:8081/realms/dyplom
      CORS_ALLOWED_ORIGINS: http://localhost:4200
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

volumes:
  pgdata:
