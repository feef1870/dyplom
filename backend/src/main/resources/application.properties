spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dyplom}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:12345678}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

spring.flyway.enabled=true

app.security.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/dyplom/protocol/openid-connect/certs}
app.security.issuer=${KEYCLOAK_ISSUER:http://localhost:8081/realms/dyplom}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

app.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
app.minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
app.minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
app.minio.bucket=${MINIO_BUCKET:dyplom}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=60MB
